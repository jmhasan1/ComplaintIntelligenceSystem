services:
  postgres:
    image: postgres:16
    container_name: MeddiQA-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: MeddiQA
      POSTGRES_USER: MeddiQA
      POSTGRES_PASSWORD: MeddiQA
    ports:
      - "5432:5432"
    volumes:
      - MeddiQA_pgdata:/var/lib/postgresql/data

volumes:
  MeddiQA_pgdata:
